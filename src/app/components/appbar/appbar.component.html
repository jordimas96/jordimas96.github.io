<header #appbar id="appbar" class="appbar v" [class.shadow-3-l]="m.scroll > 0" [class.scrolled]="m.scroll > 0" jmpMostrarAmbAnimacio>

    <div class="esquerra">
        <button class="rs boto-sidebar" (click)="m.sidebar.toggle()" aria-label="Open sidebar" matRipple>
            <i class="fa-solid fa-bars d-block"></i>
        </button>
    </div>

    <div class="mig">
    <!-- <jmp-navegacio-tab class="w-0 w-lg-auto m-2" /> -->

        <jmp-marcador-pagina-actual [class.ocult]="buscadorObert" />

        @if (buscadorObert) {
            <div class="buscador-wrapper"
                animate.enter="fadeout-a-dreta-r"
                animate.leave="fadeout-a-dreta">
                <jmp-input-buscador />
            </div>
        }

    </div>

    <div class="dreta">
        <div class="zona-boto-buscador">
            <button class="rs boto boto-buscador" [class.vermell]="buscadorObert" (click)="toggleBuscador()">
                @if (buscadorObert) {
                    <i class="fa-solid fa-xmark"
                        animate.enter="icona-a-dreta-r"
                        animate.leave="icona-a-dreta"
                    ></i>
                } @else {
                    <i class="fa-solid fa-magnifying-glass"
                        animate.enter="icona-a-esquerra-r"
                        animate.leave="icona-a-esquerra"
                    ></i>
                }
            </button>
        </div>

        @if (m.esPantallaPc) {
            <jmp-selector-idioma class="me-2 mx-lg-4" />
        }
    </div>

</header>
