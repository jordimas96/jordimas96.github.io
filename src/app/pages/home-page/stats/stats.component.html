<section id="stats">

    <div class="titol white-title-shadow h2 mb-4 text-center" jmpMostrarAmbAnimacio>
        @if (m.ca) { Estadístiques }
        @if (m.es) { Estadísticas }
        @if (m.en) { Stats }
    </div>

    <div class="stats section">
        <div class="stat card-themed bg-colored" jmpMostrarAmbAnimacio>
            <div class="titol">
                @if (m.ca) { Experiència total }
                @if (m.es) { Experiencia total }
                @if (m.en) { Total experience }
            </div>
            <div class="valor" [innerHTML]="getText(Skill._TOTAL)"></div>
        </div>

        <div class="stat card-themed bg-colored clickable paleta-170" (click)="obrirPaginaSkill(Skill.FRONTEND)" matRipple jmpMostrarAmbAnimacio>
            <div class="titol">Frontend</div>
            <div class="valor" [innerHTML]="getText(Skill.FRONTEND)"></div>
        </div>
        <div class="stat card-themed bg-colored clickable paleta-207" (click)="obrirPaginaSkill(Skill.BACKEND)" matRipple jmpMostrarAmbAnimacio>
            <div class="titol">Backend</div>
            <div class="valor" [innerHTML]="getText(Skill.BACKEND)"></div>
        </div>
        <div class="stat card-themed bg-colored clickable paleta-347" (click)="obrirPaginaSkill(Skill.ANGULAR)" matRipple jmpMostrarAmbAnimacio>
            <div class="titol">Angular</div>
            <div class="valor" [innerHTML]="getText(Skill.ANGULAR)"></div>
        </div>
        <div class="stat card-themed bg-colored clickable paleta-260" (click)="obrirPaginaSkill(Skill.CSS)" matRipple jmpMostrarAmbAnimacio>
            <div class="titol">CSS</div>
            <div class="valor" [innerHTML]="getText(Skill.CSS)"></div>
        </div>
        <div class="stat card-themed bg-colored clickable paleta-53" (click)="obrirPaginaSkill(Skill.JAVASCRIPT)" matRipple jmpMostrarAmbAnimacio>
            <div class="titol">JavaScript</div>
            <div class="valor" [innerHTML]="getText(Skill.JAVASCRIPT)"></div>
        </div>
    </div>


</section>
